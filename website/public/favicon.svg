<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vs-tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="vs-arrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- 圆角版本标签 -->
  <rect x="8" y="20" width="48" height="28" rx="7" fill="url(#vs-tag)"/>

  <!-- 标签文字 v1.2.3 -->
  <text x="32" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">v1.2</text>

  <!-- 右上角向上递进的箭头：体现「升级到新版本」 -->
  <g stroke="url(#vs-arrow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M40 16 L48 8 L56 16"/>
    <path d="M48 8 L48 22"/>
  </g>
</svg>
